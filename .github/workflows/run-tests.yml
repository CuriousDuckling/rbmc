name: run-tests

on:
  push:
  pull_request:

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up Quarto 
        uses: quarto-dev/quarto-actions/setup@v2
          
      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c(
            "shiny",
            "flexdashboard",
            "shinydashboard",
            "gt",
            "dplyr",
            "magrittr",
            "tidyr",
            "shinybusy",
            "shinyBS",
            "shinyWidgets",
            "shinyjs",
            "shinytest2",
            "pdftools",
            "quarto"
          ))

      - name: Run tests
        shell: Rscript {0}
        run: |
          shiny::runTests(".", assert = TRUE)

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-tests
          path: tests